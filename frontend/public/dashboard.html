<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블라인드 검증 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: #f1f5f9; }
    .risk-HIGH   { background:#fef2f2; color:#dc2626; border-color:#fca5a5; }
    .risk-MEDIUM { background:#fffbeb; color:#d97706; border-color:#fcd34d; }
    .risk-LOW    { background:#f0fdf4; color:#16a34a; border-color:#86efac; }
    .progress-bar { transition: width .5s ease; }
    .status-processing { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .verdict-위반 { background:#fef2f2; border-color:#fca5a5; color:#991b1b; }
    .verdict-주의 { background:#fffbeb; border-color:#fde68a; color:#92400e; }
    .verdict-허용 { background:#f0fdf4; border-color:#bbf7d0; color:#166534; }
    .job-card { cursor:pointer; transition: box-shadow .15s, border-color .15s; }
    .job-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.09); }
    .job-card.active { border-color: #6366f1 !important; box-shadow: 0 0 0 3px #e0e7ff; }
    .detail-panel { display:none; }
    .detail-panel.open { display:block; }
    .tab-btn { border-bottom: 2px solid transparent; transition: all .15s; }
    .tab-btn.active { border-bottom-color: #6366f1; color: #6366f1; font-weight: 600; }
    .filter-btn { transition: all .1s; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
    .slide-down { animation: slideDown .2s ease; }
    @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body class="min-h-screen">

<!-- 헤더 -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🛡️</span>
      <div>
        <h1 class="text-base font-bold text-slate-800">블라인드 검증 대시보드</h1>
        <p class="text-xs text-slate-400">서버에서 처리 · 브라우저 종료 후에도 계속 실행</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="loadJobs()" class="text-xs text-slate-400 hover:text-indigo-500 px-2 py-1.5 rounded hover:bg-slate-100">
        <i class="fas fa-rotate-right mr-1"></i>새로고침
      </button>
      <a href="/" class="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg hover:bg-indigo-700 font-medium">
        <i class="fas fa-plus mr-1"></i>새 검증
      </a>
    </div>
  </div>
</header>

<!-- 2단 레이아웃: 좌측 목록 / 우측 상세 -->
<div class="max-w-6xl mx-auto px-4 py-5 flex gap-5 items-start">

  <!-- ── 좌측: 작업 목록 ── -->
  <div class="w-80 flex-shrink-0 space-y-3">
    <!-- 요약 배지 -->
    <div id="summaryBar" class="flex gap-2 text-xs hidden">
      <span id="badge-running" class="px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-700 font-medium hidden"></span>
      <span id="badge-done"    class="px-2.5 py-1 rounded-full bg-green-100  text-green-700  font-medium hidden"></span>
      <span id="badge-fail"    class="px-2.5 py-1 rounded-full bg-red-100    text-red-600    font-medium hidden"></span>
    </div>

    <!-- 카드 목록 -->
    <div id="jobList">
      <div class="bg-white rounded-2xl border border-slate-100 p-8 text-center text-slate-400 text-sm">
        <i class="fas fa-inbox text-3xl mb-3 block text-slate-300"></i>
        작업이 없습니다.<br>
        <a href="/" class="text-indigo-500 hover:underline text-xs mt-1 inline-block">새 검증 시작하기</a>
      </div>
    </div>
  </div>

  <!-- ── 우측: 상세 패널 ── -->
  <div class="flex-1 min-w-0">
    <!-- 빈 상태 -->
    <div id="detailEmpty" class="bg-white rounded-2xl border border-slate-100 p-16 text-center text-slate-400">
      <i class="fas fa-hand-pointer text-4xl mb-4 block text-slate-200"></i>
      <p class="font-medium">좌측 카드를 클릭하면<br>상세 결과가 여기에 표시됩니다</p>
    </div>

    <!-- 진행 중 상세 -->
    <div id="detailRunning" class="detail-panel bg-white rounded-2xl border border-slate-100 p-6">
      <div class="flex items-center gap-3 mb-5">
        <span class="text-2xl status-processing">⏳</span>
        <div class="flex-1 min-w-0">
          <p id="dr-filename" class="font-bold text-slate-800 truncate"></p>
          <p id="dr-meta"     class="text-xs text-slate-400 mt-0.5"></p>
        </div>
      </div>
      <div class="mb-2 flex justify-between text-sm">
        <span id="dr-msg" class="text-slate-600 truncate"></span>
        <span id="dr-pct" class="font-bold text-indigo-600 ml-2 flex-shrink-0"></span>
      </div>
      <div class="h-3 bg-slate-100 rounded-full overflow-hidden mb-6">
        <div id="dr-bar" class="progress-bar h-full bg-indigo-500 rounded-full status-processing" style="width:0%"></div>
      </div>
      <!-- 단계 표시 -->
      <div class="space-y-2" id="dr-steps">
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <i class="fas fa-file-alt w-4 text-center"></i> PDF 텍스트 스캔 및 규칙 탐지
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <i class="fas fa-images w-4 text-center"></i> 페이지 이미지 변환
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <i class="fas fa-robot w-4 text-center"></i> Claude Vision AI 분석
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <i class="fas fa-chart-bar w-4 text-center"></i> 결과 합산 및 리포트 생성
        </div>
      </div>
    </div>

    <!-- 완료 상세 -->
    <div id="detailDone" class="detail-panel space-y-4 slide-down">
      <!-- 헤더 -->
      <div class="bg-white rounded-2xl border border-slate-100 p-5">
        <div class="flex items-start justify-between gap-3 mb-4">
          <div class="min-w-0">
            <p id="dd-filename" class="font-bold text-slate-800 text-lg truncate"></p>
            <p id="dd-meta"     class="text-xs text-slate-400 mt-0.5"></p>
          </div>
          <div class="flex gap-2 flex-shrink-0">
            <span id="dd-risk" class="text-sm px-3 py-1.5 rounded-lg border font-semibold"></span>
            <button id="dd-delete" class="text-xs text-slate-400 hover:text-red-500 px-2 py-1.5 rounded hover:bg-red-50">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
        <!-- 통계 -->
        <div class="grid grid-cols-3 gap-3">
          <div class="bg-red-50 border border-red-100 rounded-xl p-3 text-center">
            <p id="dd-v" class="text-2xl font-bold text-red-600"></p>
            <p class="text-xs text-red-400 mt-0.5">위반</p>
          </div>
          <div class="bg-amber-50 border border-amber-100 rounded-xl p-3 text-center">
            <p id="dd-c" class="text-2xl font-bold text-amber-600"></p>
            <p class="text-xs text-amber-400 mt-0.5">주의</p>
          </div>
          <div class="bg-slate-50 border border-slate-100 rounded-xl p-3 text-center">
            <p id="dd-a" class="text-2xl font-bold text-slate-600"></p>
            <p class="text-xs text-slate-400 mt-0.5">허용</p>
          </div>
        </div>
        <!-- 노트 -->
        <div id="dd-notes" class="flex flex-wrap gap-2 mt-3"></div>
      </div>

      <!-- 탭 -->
      <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <div class="flex border-b border-slate-100 px-4">
          <button class="tab-btn active text-sm px-4 py-3" onclick="switchTab('pages', this)">페이지별 결과</button>
          <button class="tab-btn text-sm px-4 py-3 text-slate-500" onclick="switchTab('all', this)">전체 검출 목록</button>
        </div>

        <!-- 페이지별 탭 -->
        <div id="tabPages" class="detail-panel open p-4">
          <div class="flex gap-2 mb-3 flex-wrap">
            <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-indigo-100 text-indigo-700 font-medium" onclick="filterPages('all',this)">전체</button>
            <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-100 text-slate-600" onclick="filterPages('violation',this)">위반만</button>
            <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-100 text-slate-600" onclick="filterPages('caution',this)">주의만</button>
            <button class="filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-100 text-slate-600" onclick="filterPages('clean',this)">이상없음</button>
          </div>
          <div id="pageList" class="space-y-2"></div>
        </div>

        <!-- 전체 목록 탭 -->
        <div id="tabAll" class="detail-panel p-4">
          <div class="overflow-x-auto">
            <table class="w-full text-xs border-collapse">
              <thead>
                <tr class="bg-slate-50 text-slate-500 text-left">
                  <th class="px-3 py-2 border-b">페이지</th>
                  <th class="px-3 py-2 border-b">유형</th>
                  <th class="px-3 py-2 border-b">검출 내용</th>
                  <th class="px-3 py-2 border-b">판정</th>
                  <th class="px-3 py-2 border-b">사유</th>
                </tr>
              </thead>
              <tbody id="allTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- 실패 상세 -->
    <div id="detailFailed" class="detail-panel bg-white rounded-2xl border border-red-100 p-6">
      <div class="flex items-center gap-3 mb-4">
        <span class="text-2xl">❌</span>
        <div>
          <p id="df-filename" class="font-bold text-slate-800"></p>
          <p id="df-meta"     class="text-xs text-slate-400 mt-0.5"></p>
        </div>
      </div>
      <div class="bg-red-50 border border-red-100 rounded-xl p-4 text-sm text-red-700 mb-4">
        <i class="fas fa-exclamation-triangle mr-2"></i>
        <span id="df-error"></span>
      </div>
      <button id="df-delete" class="text-xs bg-red-100 text-red-500 px-3 py-2 rounded-lg hover:bg-red-200">
        <i class="fas fa-trash mr-1"></i> 삭제
      </button>
    </div>
  </div>
</div>

<script>
// ── 상태 ────────────────────────────────────────────────────
let _jobs         = [];
let _activeSSEs   = {};
let _selectedId   = null;
let _currentReport= null;
let _currentFilter= 'all';

// ── 초기화 ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadJobs();
  setInterval(loadJobs, 12000);
});

// ── Job 목록 로드 ────────────────────────────────────────────
async function loadJobs() {
  try {
    const res = await fetch('/api/jobs/list');
    _jobs = await res.json();
    renderJobList();
    // 진행 중 항목 SSE 연결
    _jobs.filter(j => ['pending','processing'].includes(j.status))
         .forEach(j => attachSSE(j.job_id));
    // 선택된 항목 상태 유지 갱신
    if (_selectedId) {
      const updated = _jobs.find(j => j.job_id === _selectedId);
      if (updated) updateDetail(updated);
    }
  } catch(e) { console.error(e); }
}

// ── 카드 목록 렌더링 ─────────────────────────────────────────
function renderJobList() {
  const running  = _jobs.filter(j => ['pending','processing'].includes(j.status));
  const finished = _jobs.filter(j => !['pending','processing'].includes(j.status));

  // 요약 배지
  const sb = document.getElementById('summaryBar');
  if (_jobs.length > 0) {
    sb.classList.remove('hidden');
    const br = document.getElementById('badge-running');
    const bd = document.getElementById('badge-done');
    const bf = document.getElementById('badge-fail');
    const done = finished.filter(j => j.status === 'completed');
    const fail = finished.filter(j => j.status === 'failed');
    running.length > 0 ? (br.textContent = `⏳ 진행 ${running.length}`, br.classList.remove('hidden')) : br.classList.add('hidden');
    done.length    > 0 ? (bd.textContent = `✅ 완료 ${done.length}`,    bd.classList.remove('hidden')) : bd.classList.add('hidden');
    fail.length    > 0 ? (bf.textContent = `❌ 실패 ${fail.length}`,    bf.classList.remove('hidden')) : bf.classList.add('hidden');
  } else {
    sb.classList.add('hidden');
  }

  if (_jobs.length === 0) {
    document.getElementById('jobList').innerHTML = `
      <div class="bg-white rounded-2xl border border-slate-100 p-8 text-center text-slate-400 text-sm">
        <i class="fas fa-inbox text-3xl mb-3 block text-slate-300"></i>
        작업이 없습니다.<br>
        <a href="/" class="text-indigo-500 hover:underline text-xs mt-1 inline-block">새 검증 시작하기</a>
      </div>`;
    return;
  }

  let html = '';
  if (running.length > 0) {
    html += `<p class="text-xs text-slate-400 font-semibold uppercase tracking-wide px-1 mb-1.5">진행 중</p>`;
    html += running.map(renderCard).join('');
    if (finished.length > 0) html += `<div class="my-3 border-t border-slate-200"></div>`;
  }
  if (finished.length > 0) {
    html += `<p class="text-xs text-slate-400 font-semibold uppercase tracking-wide px-1 mb-1.5">완료된 검증</p>`;
    html += finished.map(renderCard).join('');
  }
  document.getElementById('jobList').innerHTML = html;
}

function renderCard(j) {
  const isRunning = ['pending','processing'].includes(j.status);
  const isFailed  = j.status === 'failed';
  const isDone    = j.status === 'completed';
  const isSelected= j.job_id === _selectedId;

  const riskCls = isDone && j.risk_level ? `risk-${j.risk_level}` : '';
  const riskLbl = j.risk_level === 'HIGH' ? '🔴 고위험' : j.risk_level === 'MEDIUM' ? '🟡 중위험' : j.risk_level === 'LOW' ? '🟢 저위험' : '';
  const cardBorder = isSelected ? 'border-indigo-400' : isFailed ? 'border-red-100' : isDone ? 'border-slate-100' : 'border-indigo-100';
  const cardBg     = isFailed ? 'bg-red-50' : isDone ? 'bg-white' : 'bg-indigo-50/60';
  const activeCls  = isSelected ? 'job-card active' : 'job-card';
  const created    = j.created_at ? j.created_at.slice(0,16).replace('T',' ') : '';
  const fsize      = j.file_size ? `${(j.file_size/1024/1024).toFixed(1)}MB` : '';

  const progressHtml = isRunning ? `
    <div class="mt-2">
      <div class="flex justify-between text-xs text-slate-400 mb-1">
        <span id="cmsg-${j.job_id}" class="truncate">${j.message||'처리 중…'}</span>
        <span id="cpct-${j.job_id}" class="ml-1 flex-shrink-0">${j.progress||0}%</span>
      </div>
      <div class="h-1 bg-white/80 rounded-full overflow-hidden">
        <div id="cbar-${j.job_id}" class="progress-bar h-full bg-indigo-400 rounded-full status-processing" style="width:${j.progress||0}%"></div>
      </div>
    </div>` : '';

  const statsHtml = isDone ? `
    <div class="flex gap-2 mt-1.5 text-xs">
      <span class="text-red-500">위반 ${j.violation_count??0}</span>
      <span class="text-amber-500">주의 ${j.caution_count??0}</span>
    </div>` : '';

  return `
    <div class="${activeCls} border rounded-xl p-3.5 mb-2 ${cardBorder} ${cardBg}" onclick="selectJob('${j.job_id}')">
      <div class="flex items-start gap-2">
        <span class="text-base mt-0.5 flex-shrink-0">${isRunning?'⏳':isFailed?'❌':'📄'}</span>
        <div class="min-w-0 flex-1">
          <p class="text-xs font-semibold text-slate-700 truncate" title="${j.filename}">${j.filename}</p>
          <p class="text-xs text-slate-400 mt-0.5">${fsize}${fsize&&created?' · ':''}${created}</p>
          ${progressHtml}
          ${statsHtml}
        </div>
        ${isDone && riskLbl ? `<span class="text-xs px-1.5 py-0.5 rounded border font-medium flex-shrink-0 ${riskCls} ml-1">${riskLbl}</span>` : ''}
      </div>
    </div>`;
}

// ── 카드 선택 ────────────────────────────────────────────────
function selectJob(jobId) {
  _selectedId = jobId;
  // 카드 active 표시 갱신
  document.querySelectorAll('.job-card').forEach(el => el.classList.remove('active'));
  const cardEl = document.getElementById(`card-${jobId}`);
  // id 기반 대신 onclick 속성으로 찾기
  document.querySelectorAll('.job-card').forEach(el => {
    if (el.getAttribute('onclick') === `selectJob('${jobId}')`) el.classList.add('active');
  });

  const job = _jobs.find(j => j.job_id === jobId);
  if (job) showDetail(job);
}

async function showDetail(job) {
  // 패널 전환
  document.getElementById('detailEmpty').style.display   = 'none';
  document.getElementById('detailRunning').classList.remove('open');
  document.getElementById('detailDone').classList.remove('open');
  document.getElementById('detailFailed').classList.remove('open');

  const isRunning = ['pending','processing'].includes(job.status);
  const isFailed  = job.status === 'failed';
  const isDone    = job.status === 'completed';
  const fsize     = job.file_size ? `${(job.file_size/1024/1024).toFixed(1)}MB` : '';
  const created   = job.created_at ? job.created_at.slice(0,16).replace('T',' ') : '';

  if (isRunning) {
    document.getElementById('dr-filename').textContent = job.filename || '';
    document.getElementById('dr-meta').textContent     = `${fsize}${fsize&&created?' · ':''}${created}`;
    document.getElementById('dr-msg').textContent      = job.message || '처리 중…';
    document.getElementById('dr-pct').textContent      = (job.progress||0) + '%';
    document.getElementById('dr-bar').style.width      = (job.progress||0) + '%';
    document.getElementById('detailRunning').classList.add('open');

  } else if (isFailed) {
    document.getElementById('df-filename').textContent = job.filename || '';
    document.getElementById('df-meta').textContent     = `${fsize}${fsize&&created?' · ':''}${created}`;
    document.getElementById('df-error').textContent    = job.error || '알 수 없는 오류';
    document.getElementById('df-delete').onclick       = () => deleteJob(job.job_id);
    document.getElementById('detailFailed').classList.add('open');

  } else if (isDone) {
    // 리포트 로드
    try {
      const res    = await fetch(`/api/jobs/${job.job_id}/report`);
      if (!res.ok) throw new Error('리포트 없음');
      const report = await res.json();
      _currentReport = report;
      _currentFilter = 'all';

      document.getElementById('dd-filename').textContent = report.filename || '';
      document.getElementById('dd-meta').textContent     =
        `${report.total_pages}페이지 · ${report.processing_time_seconds}s · ${(report.created_at||'').slice(0,16).replace('T',' ')}`;

      // 위험도
      const riskEl = document.getElementById('dd-risk');
      riskEl.className = `text-sm px-3 py-1.5 rounded-lg border font-semibold risk-${report.risk_level}`;
      riskEl.textContent = report.risk_level==='HIGH'?'🔴 고위험':report.risk_level==='MEDIUM'?'🟡 중위험':'🟢 저위험';

      document.getElementById('dd-v').textContent = report.violation_count ?? 0;
      document.getElementById('dd-c').textContent = report.caution_count   ?? 0;
      document.getElementById('dd-a').textContent = report.allowed_count   ?? 0;

      // 노트
      document.getElementById('dd-notes').innerHTML =
        (report.summary?.notes||[]).map(n =>
          `<span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">${n}</span>`
        ).join('');

      document.getElementById('dd-delete').onclick = () => deleteJob(job.job_id);

      // 탭 초기화
      switchTab('pages', document.querySelector('#tabPages').previousElementSibling);
      document.querySelectorAll('.filter-btn').forEach((b,i) => {
        b.className = i===0
          ? 'filter-btn text-xs px-3 py-1.5 rounded-full bg-indigo-100 text-indigo-700 font-medium'
          : 'filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-100 text-slate-600';
      });

      renderPageList(report.page_results, 'all');
      renderAllTable(report.page_results);

      document.getElementById('detailDone').classList.add('open');
    } catch(e) {
      alert('결과를 불러올 수 없습니다: ' + e.message);
    }
  }
}

// ── SSE 연결 & 상세 패널 실시간 업데이트 ──────────────────────
function attachSSE(jobId) {
  if (_activeSSEs[jobId]) return;
  const es = new EventSource(`/api/jobs/${jobId}/progress`);
  _activeSSEs[jobId] = es;
  es.onmessage = e => {
    try {
      const data = JSON.parse(e.data);
      if (data.error) { es.close(); delete _activeSSEs[jobId]; return; }
      // 카드 내 미니 진행바 업데이트
      const msgEl = document.getElementById(`cmsg-${jobId}`);
      const pctEl = document.getElementById(`cpct-${jobId}`);
      const barEl = document.getElementById(`cbar-${jobId}`);
      if (msgEl) msgEl.textContent = data.message || '';
      if (pctEl) pctEl.textContent = (data.progress||0) + '%';
      if (barEl) barEl.style.width = (data.progress||0) + '%';
      // 선택된 카드의 우측 상세 패널도 갱신
      if (_selectedId === jobId) {
        document.getElementById('dr-msg').textContent = data.message || '';
        document.getElementById('dr-pct').textContent = (data.progress||0) + '%';
        document.getElementById('dr-bar').style.width = (data.progress||0) + '%';
      }
      if (data.status === 'completed' || data.status === 'failed') {
        es.close(); delete _activeSSEs[jobId];
        loadJobs();
        if (_selectedId === jobId) {
          const updated = _jobs.find(j=>j.job_id===jobId) || {...data, job_id:jobId, filename:''};
          setTimeout(()=>loadJobs().then(()=>{
            const j2 = _jobs.find(j=>j.job_id===jobId);
            if (j2) showDetail(j2);
          }), 500);
        }
      }
    } catch {}
  };
  es.onerror = () => { es.close(); delete _activeSSEs[jobId]; };
}

function updateDetail(job) {
  if (job.status !== _currentDetailStatus) loadJobs();
}
let _currentDetailStatus = null;

// ── 삭제 ───────────────────────────────────────────────────
async function deleteJob(jobId) {
  if (!confirm('이 작업을 삭제하시겠습니까?')) return;
  try {
    await fetch(`/api/jobs/${jobId}`, { method: 'DELETE' });
    if (_selectedId === jobId) {
      _selectedId = null;
      _currentReport = null;
      document.getElementById('detailEmpty').style.display = '';
      ['detailRunning','detailDone','detailFailed'].forEach(id =>
        document.getElementById(id).classList.remove('open'));
    }
    loadJobs();
  } catch(e) { alert('삭제 실패: ' + e.message); }
}

// ── 탭 전환 ─────────────────────────────────────────────────
function switchTab(tab, btn) {
  document.getElementById('tabPages').classList.toggle('open', tab==='pages');
  document.getElementById('tabAll').classList.toggle('open',   tab==='all');
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.remove('active');
    b.classList.add('text-slate-500');
  });
  if (btn) { btn.classList.add('active'); btn.classList.remove('text-slate-500'); }
}

// ── 페이지 필터 ─────────────────────────────────────────────
function filterPages(f, btn) {
  _currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b =>
    b.className = 'filter-btn text-xs px-3 py-1.5 rounded-full bg-slate-100 text-slate-600');
  btn.className = 'filter-btn text-xs px-3 py-1.5 rounded-full bg-indigo-100 text-indigo-700 font-medium';
  if (_currentReport) renderPageList(_currentReport.page_results, f);
}

// ── 페이지 목록 렌더링 (유형별 묶음) ─────────────────────────
function renderPageList(pages, filter) {
  const WEIGHT = {'위반':0,'주의':1,'허용':2};
  let list = (pages||[]).filter(p => p.page_number > 0);
  if (filter==='violation') list = list.filter(p => p.violation_count > 0);
  else if (filter==='caution') list = list.filter(p => p.caution_count > 0 && p.violation_count===0);
  else if (filter==='clean')   list = list.filter(p => p.violation_count===0 && p.caution_count===0);

  if (list.length===0) {
    document.getElementById('pageList').innerHTML =
      '<p class="text-center text-slate-400 text-sm py-8">해당 조건의 페이지가 없습니다.</p>';
    return;
  }
  document.getElementById('pageList').innerHTML = list.map(page => {
    const v = page.violation_count||0, c = page.caution_count||0;
    const sBorder = v>0?'border-red-200 bg-red-50':c>0?'border-amber-200 bg-amber-50':'border-green-200 bg-green-50';
    const sIcon   = v>0?'🔴':c>0?'🟡':'🟢';

    // 유형별 그룹
    const typeMap = {};
    for (const d of (page.detections||[])) {
      (typeMap[d.detection_type||'기타'] = typeMap[d.detection_type||'기타']||[]).push(d);
    }
    const groups = Object.entries(typeMap).map(([type,items])=>{
      items.sort((a,b)=>(WEIGHT[a.verdict]??9)-(WEIGHT[b.verdict]??9));
      return {type,items,worst:items[0]?.verdict||'허용'};
    }).sort((a,b)=>(WEIGHT[a.worst]??9)-(WEIGHT[b.worst]??9));

    const detHtml = groups.map(({type,items,worst})=>{
      const hCls = worst==='위반'?'bg-red-100 text-red-700 border-red-200'
                  :worst==='주의'?'bg-amber-100 text-amber-700 border-amber-200'
                  :'bg-green-100 text-green-700 border-green-200';
      const hIcon = worst==='위반'?'🔴':worst==='주의'?'🟡':'🟢';
      const cnt   = items.length>1?` <span class="font-normal opacity-60">(${items.length}건)</span>`:'';
      const iHtml = items.map(d=>{
        const vc=`verdict-${d.verdict}`;
        return `<div class="text-xs px-2.5 py-2 rounded border ${vc} mb-1">
          <div class="flex items-center justify-between gap-2 mb-0.5">
            <span class="font-mono break-all">${d.detected_text?`"${d.detected_text.slice(0,150)}"`:d.image_description?`[이미지] ${d.image_description}`:'—'}</span>
            <span class="flex-shrink-0 text-xs px-1.5 py-0.5 rounded font-medium ${vc}">${d.verdict}</span>
          </div>
          ${d.reason?`<p class="opacity-70 mt-0.5">${d.reason}</p>`:''}
        </div>`;
      }).join('');
      return `<div class="mb-2">
        <div class="flex items-center gap-1.5 px-2 py-1 rounded-t border ${hCls} text-xs font-semibold">${hIcon} ${type}${cnt}</div>
        <div class="border border-t-0 rounded-b border-slate-200 px-2 py-1.5 bg-white">${iHtml}</div>
      </div>`;
    }).join('');

    return `<div class="border rounded-xl overflow-hidden ${sBorder}">
      <button class="w-full flex items-center gap-3 p-3 text-left" onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('.ci').style.transform=this.nextElementSibling.classList.contains('hidden')?'':'rotate(180deg)'">
        <span>${sIcon}</span>
        <div class="flex-1 text-sm">
          <span class="font-semibold text-slate-700">${page.page_number}페이지</span>
          ${v>0?`<span class="ml-2 text-xs text-red-600">${v}건 위반</span>`:''}
          ${c>0?`<span class="ml-1 text-xs text-amber-600">${c}건 주의</span>`:''}
          ${v===0&&c===0?'<span class="ml-2 text-xs text-green-600">이상 없음</span>':''}
        </div>
        <i class="fas fa-chevron-down text-slate-400 text-xs ci transition-transform"></i>
      </button>
      <div class="hidden px-3 pb-3 pt-1">
        ${detHtml||'<p class="text-xs text-green-600 text-center py-2">검출된 항목이 없습니다.</p>'}
      </div>
    </div>`;
  }).join('');
}

// ── 전체 검출 테이블 ─────────────────────────────────────────
function renderAllTable(pages) {
  const ORDER = {'위반':0,'주의':1,'허용':2};
  const all = [];
  (pages||[]).forEach(p =>
    (p.detections||[]).forEach(d => all.push({...d, pLabel:p.page_number===0?'메타':`${p.page_number}p`})));
  all.sort((a,b) => (ORDER[a.verdict]??9)-(ORDER[b.verdict]??9));
  if (!all.length) {
    document.getElementById('allTable').innerHTML =
      '<tr><td colspan="6" class="text-center py-8 text-slate-400">검출된 항목이 없습니다.</td></tr>';
    return;
  }
  document.getElementById('allTable').innerHTML = all.map(d => {
    const vc = `verdict-${d.verdict}`;
    return `<tr class="border-b border-slate-50 hover:bg-slate-50">
      <td class="px-3 py-2 text-slate-500">${d.pLabel}</td>
      <td class="px-3 py-2">${d.detection_type||''}</td>
      <td class="px-3 py-2 max-w-xs"><span class="font-mono break-all">${(d.detected_text||d.image_description||'').slice(0,80)}</span></td>
      <td class="px-3 py-2"><span class="px-2 py-0.5 rounded text-xs font-medium ${vc}">${d.verdict}</span></td>
      <td class="px-3 py-2 text-slate-500 max-w-xs">${(d.reason||'').slice(0,100)}</td>
    </tr>`;
  }).join('');
}
</script>
